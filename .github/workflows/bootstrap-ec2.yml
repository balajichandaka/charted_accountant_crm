# One-time setup on a fresh EC2 instance: Docker, git, clone prod branch.
# Run manually once per new server, then use "Deploy to EC2" for all app updates.
name: Bootstrap EC2 (one-time)

on:
  workflow_dispatch:

concurrency:
  group: bootstrap-ec2
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap new EC2
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install Docker and clone repo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then APP_DIR="$HOME/charted_accountant_crm"; fi
            REPO_URL="https://github.com/balajichandaka/charted_accountant_crm.git"
            DEPLOY_BRANCH=prod

            if command -v docker >/dev/null 2>&1 && [ -d "$APP_DIR/.git" ]; then
              echo "Docker and repo already present at $APP_DIR — skipping bootstrap."
              exit 0
            fi

            TMP=$(mktemp)
            curl -fsSL "https://raw.githubusercontent.com/balajichandaka/charted_accountant_crm/prod/scripts/ec2-bootstrap.sh" -o "$TMP"
            chmod +x "$TMP"
            REPO_URL="$REPO_URL" APP_DIR="$APP_DIR" DEPLOY_BRANCH="$DEPLOY_BRANCH" "$TMP"
            rm -f "$TMP"

            echo "Bootstrap complete. Next: run 'Deploy to EC2' workflow (writes .env from secrets and starts containers)."
