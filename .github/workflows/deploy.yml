name: Deploy to EC2

on:
  push:
    branches: [prod, feature_1.0]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: prod
        type: choice
        options:
          - prod
          - feature_1.0

concurrency:
  group: deploy-ec2-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  resolve:
    name: Resolve target machine
    runs-on: ubuntu-latest
    outputs:
      deploy_branch: ${{ steps.pick.outputs.deploy_branch }}
      github_environment: ${{ steps.pick.outputs.github_environment }}
      write_env_profile: ${{ steps.pick.outputs.write_env_profile }}
      machine_label: ${{ steps.pick.outputs.machine_label }}
    steps:
      - id: pick
        run: |
          BRANCH="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}"
          echo "deploy_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "prod" ]; then
            echo "github_environment=production" >> "$GITHUB_OUTPUT"
            echo "write_env_profile=prod" >> "$GITHUB_OUTPUT"
            echo "machine_label=Production EC2 (prod branch, self-hosted Postgres)" >> "$GITHUB_OUTPUT"
          else
            echo "github_environment=staging" >> "$GITHUB_OUTPUT"
            echo "write_env_profile=staging" >> "$GITHUB_OUTPUT"
            echo "machine_label=Staging EC2 (feature_1.0 branch, Render Postgres)" >> "$GITHUB_OUTPUT"
          fi

          echo "══════════════════════════════════════════"
          echo "  DEPLOY TARGET (resolved)"
          echo "══════════════════════════════════════════"
          echo "  Branch:       $BRANCH"
          if [ "$BRANCH" = "prod" ]; then
            echo "  Environment:  production"
            echo "  Machine:      Production EC2 (prod branch, self-hosted Postgres)"
          else
            echo "  Environment:  staging"
            echo "  Machine:      Staging EC2 (feature_1.0 branch, Render Postgres)"
          fi
          echo "══════════════════════════════════════════"

  deploy:
    name: Deploy (${{ needs.resolve.outputs.deploy_branch }})
    needs: [ci, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment: ${{ needs.resolve.outputs.github_environment }}
    env:
      DEPLOY_BRANCH: ${{ needs.resolve.outputs.deploy_branch }}
      WRITE_ENV_PROFILE: ${{ needs.resolve.outputs.write_env_profile }}
    steps:
      - name: Log deploy target
        run: |
          APP_DIR="${{ secrets.EC2_APP_DIR || vars.EC2_APP_DIR }}"
          if [ -z "$APP_DIR" ]; then APP_DIR='~/charted_accountant_crm (default on EC2)'; fi
          echo "══════════════════════════════════════════"
          echo "  DEPLOY TARGET (GitHub Actions)"
          echo "══════════════════════════════════════════"
          echo "  Branch:       ${{ needs.resolve.outputs.deploy_branch }}"
          echo "  Environment:  ${{ needs.resolve.outputs.github_environment }}"
          echo "  Profile:      ${{ needs.resolve.outputs.write_env_profile }}"
          echo "  Machine:      ${{ needs.resolve.outputs.machine_label }}"
          echo "  SSH user:     ${{ secrets.EC2_USER || vars.EC2_USER }}"
          echo "  SSH host:     ${{ secrets.EC2_HOST || vars.EC2_HOST }}"
          echo "  App dir:      $APP_DIR"
          echo "══════════════════════════════════════════"
          echo "After SSH connects, logs will show this EC2 public IP."
          echo "Compare prod vs staging runs — IPs must differ."
          echo "══════════════════════════════════════════"

      - name: Validate SSH config
        run: |
          ENV="${{ needs.resolve.outputs.github_environment }}"
          HOST="${{ secrets.EC2_HOST || vars.EC2_HOST }}"
          USER="${{ secrets.EC2_USER || vars.EC2_USER }}"
          KEY="${{ secrets.EC2_SSH_KEY || vars.EC2_SSH_KEY }}"
          missing=""
          if [ -z "$HOST" ]; then missing="${missing} EC2_HOST"; fi
          if [ -z "$USER" ]; then missing="${missing} EC2_USER"; fi
          if [ -z "$KEY" ]; then missing="${missing} EC2_SSH_KEY"; fi
          if [ -n "$missing" ]; then
            echo "ERROR: Missing for GitHub environment '$ENV':$missing"
            echo ""
            echo "Add as Environment **secrets** (recommended) or variables:"
            echo "  Settings → Environments → $ENV"
            echo ""
            if [ "$ENV" = "production" ]; then
              echo "  EC2_HOST = 50.17.16.46"
            else
              echo "  EC2_HOST = 34.236.143.82"
            fi
            echo "  EC2_USER = ec2-user"
            echo "  EC2_SSH_KEY = .pem file contents (use Secrets, not Variables)"
            exit 1
          fi
          if [ -n "${{ vars.EC2_SSH_KEY }}" ] && [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "WARNING: EC2_SSH_KEY is in Variables — move it to Secrets for security."
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          WRITE_ENV_PROFILE: ${{ env.WRITE_ENV_PROFILE }}
          DEPLOY_ENV: ${{ needs.resolve.outputs.github_environment }}
          DEPLOY_MACHINE: ${{ needs.resolve.outputs.machine_label }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME || vars.ADMIN_NAME }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL || vars.APP_PUBLIC_URL }}
        with:
          host: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          username: ${{ secrets.EC2_USER || vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY || vars.EC2_SSH_KEY }}
          command_timeout: 2h
          envs: DEPLOY_BRANCH,WRITE_ENV_PROFILE,DEPLOY_ENV,DEPLOY_MACHINE,POSTGRES_PASSWORD,ADMIN_EMAIL,ADMIN_PASSWORD,ADMIN_NAME,APP_PUBLIC_URL
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR || vars.EC2_APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then APP_DIR="$HOME/charted_accountant_crm"; fi
            export APP_DIR

            PUBLIC_IP="$(curl -sf http://checkip.amazonaws.com 2>/dev/null || hostname -I | awk '{print $1}')"

            echo "══════════════════════════════════════════"
            echo "  CONNECTED TO EC2"
            echo "══════════════════════════════════════════"
            echo "  GitHub env:   ${DEPLOY_ENV:-unknown}"
            echo "  Machine:      ${DEPLOY_MACHINE:-unknown}"
            echo "  Branch:       ${DEPLOY_BRANCH:-unknown}"
            echo "  Profile:      ${WRITE_ENV_PROFILE:-unknown}"
            echo "  App dir:      $APP_DIR"
            echo "  Hostname:     $(hostname)"
            echo "  Public IP:    ${PUBLIC_IP:-unknown}"
            echo "══════════════════════════════════════════"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Repo not found at $APP_DIR. Run 'Bootstrap EC2' for environment '${{ needs.resolve.outputs.github_environment }}' first."
              exit 1
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: Docker not installed. Run 'Bootstrap EC2' for environment '${{ needs.resolve.outputs.github_environment }}' first."
              exit 1
            fi

            cd "$APP_DIR"
            export WRITE_ENV_PROFILE DEPLOY_ENV DEPLOY_MACHINE
            DEPLOY_BRANCH="$DEPLOY_BRANCH" APP_DIR="$APP_DIR" ./scripts/deploy-ec2.sh
