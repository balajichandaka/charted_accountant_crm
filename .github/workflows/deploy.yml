name: Deploy to EC2

on:
  push:
    branches: [main, feature_1.0]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: choice
        options:
          - main
          - feature_1.0

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then
              APP_DIR="$HOME/charted_accountant_crm"
            else
              APP_DIR="${APP_DIR/#\~/$HOME}"
            fi
            if [ ! -d "$APP_DIR" ]; then
              echo "App directory not found: $APP_DIR"
              echo "Clone the repo on EC2 or fix EC2_APP_DIR (use /home/ec2-user/charted_accountant_crm, not ~/...)"
              exit 1
            fi
            cd "$APP_DIR"
            chmod +x scripts/deploy-ec2.sh scripts/compose.sh
            DEPLOY_BRANCH="${{ env.DEPLOY_BRANCH }}" APP_DIR="$APP_DIR" ./scripts/deploy-ec2.sh
