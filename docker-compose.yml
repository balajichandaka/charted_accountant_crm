# CA Practice — EC2 production stack with self-hosted PostgreSQL.
# All service env vars are defined here (or via a repo-root .env file).
#
# EC2 / production (Nginx on 80/443 → frontend :3000, backend internal :4000):
#   cp .env.example .env   # set POSTGRES_PASSWORD and secrets
#   ./scripts/compose.sh up --build -d
#
# Local Docker (same stack, bundled Postgres on the compose network):
#   APP_PUBLIC_URL=http://localhost:3000 ./scripts/compose.sh up --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ca}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ca_password}"
      POSTGRES_DB: "${POSTGRES_DB:-ca_app}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca -d ca_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ca}:${POSTGRES_PASSWORD:-ca_password}@db:5432/${POSTGRES_DB:-ca_app}?schema=public"
      JWT_SECRET: "iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0="
      AUTH_SECRET: "iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0="
      CRON_SECRET: "c0f487898ec28560067581803057de60"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "srirampadalas@gmail.com"
      SMTP_PASS: "hjkitxscubasbygg"
      EMAIL_FROM: "Alert from CA Charan <srirampadalas@gmail.com>"
      EMAIL_ENC_KEY: "${EMAIL_ENC_KEY:-}"
      FIRM_CONTACT_EMAIL: "vscharanco@gmail.com"
      FIRM_CONTACT_PHONE: "6302846943"
      FIRM_ESCALATION_NAME: "Sai Charan"
      FIRM_ESCALATION_EMAIL: "vscharanca@gmail.com"
      FIRM_ESCALATION_PHONE: "9566278894"
      FRONTEND_URL: "${APP_PUBLIC_URL:-https://cafirmops.in}"
      APP_URL: "${APP_PUBLIC_URL:-https://cafirmops.in}"
      PORT: "4000"
      UPLOAD_DIR: "/app/uploads"
      ADMIN_NAME: "${ADMIN_NAME:-Administrator}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same value at build + runtime — prevents "Failed to find Server Action" after redeploy.
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0=}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: "http://backend:4000"
      AUTH_SECRET: "iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0="
      # Multi-tenant: each firm is <slug>.cafirmops.in — do NOT set AUTH_URL to the
      # root domain or Auth.js redirects firm1.cafirmops.in → cafirmops.in (loop).
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_ROOT_DOMAIN: "${NEXT_PUBLIC_ROOT_DOMAIN:-cafirmops.in}"
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0=}"
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
