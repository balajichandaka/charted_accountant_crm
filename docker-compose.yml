# Local development only. Production: backend → Render, frontend → Vercel.
# Copy backend/.env.example → backend/.env and frontend/.env.example → frontend/.env

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ca
      POSTGRES_PASSWORD: ca_password
      POSTGRES_DB: ca_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca -d ca_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "4000"
      UPLOAD_DIR: "/app/uploads"
      NODE_ENV: production
      SEED_DB: "true"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    environment:
      # Server-side API calls from the frontend container use the compose network.
      BACKEND_URL: "http://backend:4000"
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
