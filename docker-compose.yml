# CA Practice — single Compose file for EC2 production and optional local Postgres.
# All service env vars are defined here.
#
# EC2 / production (Nginx on 80/443 → frontend :3000, backend internal :4000):
#   ./scripts/compose.sh up --build -d
#
# Local with bundled Postgres (ports 3000 + 4000 + 5432):
#   DATABASE_URL=postgresql://ca:ca_password@db:5432/ca_app?schema=public \
#   APP_PUBLIC_URL=http://localhost:3000 SEED_DB=true \
#   docker compose --profile local up --build

services:
  db:
    profiles: [local]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ca
      POSTGRES_PASSWORD: ca_password
      POSTGRES_DB: ca_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca -d ca_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://ca_management_service_admin_db_user:4XYIpOVec5X8W2UwC0cNKFuB7QfO8Ays@dpg-d8iljvtckfvc73bv09eg-a.oregon-postgres.render.com/ca_management_service_admin_db?schema=public&sslmode=require}"
      JWT_SECRET: "iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0="
      AUTH_SECRET: "iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0="
      CRON_SECRET: "c0f487898ec28560067581803057de60"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "srirampadalas@gmail.com"
      SMTP_PASS: "hjkitxscubasbygg"
      EMAIL_FROM: "Alert from CA Charan <srirampadalas@gmail.com>"
      EMAIL_ENC_KEY: "${EMAIL_ENC_KEY:-}"
      FIRM_CONTACT_EMAIL: "vscharanco@gmail.com"
      FIRM_CONTACT_PHONE: "6302846943"
      FIRM_ESCALATION_NAME: "Sai Charan"
      FIRM_ESCALATION_EMAIL: "vscharanca@gmail.com"
      FIRM_ESCALATION_PHONE: "9566278894"
      FRONTEND_URL: "${APP_PUBLIC_URL:-https://cafirmops.in}"
      APP_URL: "${APP_PUBLIC_URL:-https://cafirmops.in}"
      PORT: "4000"
      UPLOAD_DIR: "/app/uploads"
      SEED_DB: "${SEED_DB:-false}"
      NODE_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: "http://backend:4000"
      AUTH_SECRET: "iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0="
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "${APP_PUBLIC_URL:-https://cafirmops.in}"
      APP_URL: "${APP_PUBLIC_URL:-https://cafirmops.in}"
      NODE_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
