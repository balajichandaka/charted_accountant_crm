services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ca
      POSTGRES_PASSWORD: ca_password
      POSTGRES_DB: ca_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca -d ca_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://ca:ca_password@db:5432/ca_app?schema=public"
      JWT_SECRET: "iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0="
      CRON_SECRET: "c0f487898ec28560067581803057de60"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "srirampadalas@gmail.com"
      SMTP_PASS: "hjkitxscubasbygg"
      EMAIL_FROM: "CA Practice <srirampadalas@gmail.com>"
      APP_URL: "http://localhost:3000"
      FRONTEND_URL: "http://localhost:3000"
      PORT: "4000"
      UPLOAD_DIR: "/app/uploads"
      NODE_ENV: "production"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: "http://backend:4000"
      AUTH_SECRET: "iSXPhZRT+rGUrCkGLCzc8pct7qUYmqP0HCMGZN7sYB0="
      AUTH_TRUST_HOST: "true"
      APP_URL: "http://localhost:3000"
      NODE_ENV: "production"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
