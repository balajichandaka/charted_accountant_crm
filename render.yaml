# Render Blueprint — backend API only.
# Frontend deploys separately on Vercel (see frontend/.env.example).
#
# You already have Postgres on Render — set DATABASE_URL manually in the
# web service env (append ?schema=public to the connection string).
#
# Deploy: Render Dashboard → New → Blueprint → select this file
# Or: New Web Service → root directory "backend" → Docker

services:
  - type: web
    name: ca-management-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: SEED_DB
        value: "true"
